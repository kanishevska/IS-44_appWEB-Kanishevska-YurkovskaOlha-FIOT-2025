<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Всиновлення</title>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Sofia+Sans+Semi+Condensed:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <img src="images/logo.png" alt="logo" class="logo" width="3%" height="3%">
        <input type="checkbox" id="menu-toggle" />
        <label for="menu-toggle" class="burger">☰</label>

        <nav class="nav">
            <ul>
                <li><a href="index.html">На головну</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Анкета для всиновлення</h2>

        <form id="adoptForm">
            <!-- Приховане поле для AnimalID -->
            <input type="hidden" name="animalId" id="animalId">

            <p>ПІБ</p>
            <input type="text" name="name" required>

            <p>Дата народження</p>
            <input type="date" name="birthDate" required>

            <p>Контактний номер телефону</p>
            <input type="tel" name="phone" required>

            <p>Місто</p>
            <input type="text" name="city" required>

            <p>Досвід?</p>
            <label><input type="radio" name="experience" value="Yes">Так</label>
            <label><input type="radio" name="experience" value="No">Ні</label>

            <p>Час самотності</p>
            <label><input type="radio" name="timeAlone" value="2">До 2 год</label>
            <label><input type="radio" name="timeAlone" value="2-6">2-6 годин</label>
            <label><input type="radio" name="timeAlone" value="6-10">6-10 годин</label>
            <label><input type="radio" name="timeAlone" value="10+">10+ год</label>

            <input type="submit" value="Надіслати">
        </form>
    </main>

    <footer>
        <div class="contacts">
            <h3>Контакти</h3>
            <p>Контактні номери телефонів:<br>+380998853614<br>+380998853614<br>+380998853614</p><br>
        </div>

        <div class="location">
            <h3>Розташування</h3>
            <p>м. Київ <br>вул. Київська, 1, павільйон 6</p>
            <a href="https://maps.app.goo.gl/zvjNdy5TPF6ixKUy7">
                <img src="images/map.png" alt="map" width="345" height="210">
            </a>
        </div>
    </footer>


    <script>
document.addEventListener("DOMContentLoaded", () => {
    const params = new URLSearchParams(window.location.search);
    const animalId = params.get("animalId");

    if (!animalId) {
        alert("Помилка: AnimalID не передано.");
    }

    document.getElementById("adoptForm").dataset.animalId = animalId;
});

document.getElementById("adoptForm").addEventListener("submit", async function (e) {
    e.preventDefault();

    const form = e.target;

    const data = {
        fullName: form.querySelector('input[name="name"]').value,
        birthDate: form.querySelector('input[name="birthDate"]').value,
        animalId: Number(form.dataset.animalId),
        city: form.querySelector('input[name="city"]').value,
        phone: form.querySelector('input[type="tel"]').value,
        experience: form.querySelector('input[name="experience"]:checked')?.value || null,
        timeAlone: form.querySelector('input[name="timeAlone"]:checked')?.value || null,
    };

    console.log("Sending:", data); // ДІАГНОСТИКА

    try {
        const response = await fetch("http://localhost:3000/api/adoption", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        });

        const result = await response.json();

        if (response.ok) {
            alert("Анкету надіслано успішно!");
            form.reset();
        } else {
            alert("Помилка: " + result.message);
        }

    } catch (err) {
        console.error("Помилка надсилання форми:", err);
        alert("Сталася помилка. Спробуйте пізніше.");
    }
});
</script>


</body>

</html>
