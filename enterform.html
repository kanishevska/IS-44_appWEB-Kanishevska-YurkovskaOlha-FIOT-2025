<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід</title>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Sofia+Sans+Semi+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <img src="images/logo.png" alt="logo" class="logo" width="3%" height="3%">
    <input type="checkbox" id="menu-toggle" />
    <label for="menu-toggle" class="burger">☰</label>

    <nav class="nav">
        <ul>
            <li><a href="index.html">На головну</a></li>
        </ul>
    </nav>
</header>

<main>
    <h2>Вхід в систему</h2>

    <form id="loginForm">
        <p>Електронна пошта</p>
        <input type="email" name="email" required>

        <p>Пароль</p>
        <input type="password" name="password" required>

        <label>
            <input type="checkbox" id="isAdmin"> Адміністратор
        </label>
        <br><br>

        <input type="submit" value="Вхід">
    </form>

    <p id="message" style="color:red; margin-top:10px;"></p>
</main>

<footer>
    <div class="contacts">
        <h3>Контакти</h3>
        <p>Контактні номери телефонів:<br>+380998853614<br>+380998853614<br>+380998853614</p>
        <br>
    </div>

    <div class="location">
        <h3>Розташування</h3>
        <p>м. Київ <br>вул. Київська, 1, павільйон 6</p>
        <a href="https://maps.app.goo.gl/zvjNdy5TPF6ixKUy7">
            <img src="images/map.png" alt="map" width="345" height="210">
        </a>
    </div>
</footer>

<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const email = e.target.email.value.trim();
    const password = e.target.password.value.trim();
    const isAdmin = document.getElementById("isAdmin").checked;

    const res = await fetch("http://localhost:3000/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
    });

    const data = await res.json();

    if (!res.ok) {
        alert(data.message);
        return;
    }

    localStorage.setItem("user", JSON.stringify(data.user));

    if (isAdmin) {
        if (data.user.RoleID !== 1) {
            alert("Цей користувач НЕ є адміністратором!");
            return;
        }

        window.location.href = "admin/adminpage.html";
        return;
    }

    window.location.href = "userpage.html";
});

</script>


</body>
</html>
