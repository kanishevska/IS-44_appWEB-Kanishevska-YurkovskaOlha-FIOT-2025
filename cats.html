<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Коти</title>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Sofia+Sans+Semi+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <img src="images/logo.png" alt="logo" class="logo" width="3%" height="3%">
    <input type="checkbox" id="menu-toggle" />
    <label for="menu-toggle" class="burger">☰</label>

    <nav class="nav">
        <ul>
            <li><a href="index.html">На головну</a></li>
        </ul>
    </nav>
</header>

<main>
    <h2 class="animaltitle">КОТИ</h2>

    <div id="animals-container" class="animals"></div>

</main>

<footer>
    <div class="contacts">
        <h3>Контакти</h3>
        <p>Контактні номери телефонів:<br>+380998853614<br>+380998853614<br>+380998853614</p><br>
    </div>

    <div class="location">
        <h3>Розташування</h3>
        <p>м. Київ <br>вул. Київська, 1, павільйон 6</p>
        <a href="https://maps.app.goo.gl/zvjNdy5TPF6ixKUy7">
            <img src="images/map.png" alt="map" width="345" height="210">
        </a>
    </div>
</footer>

<script>
document.addEventListener("DOMContentLoaded", loadCats);

async function loadCats() {
    const container = document.getElementById("animals-container");
    container.innerHTML = "<p>Завантаження...</p>";

    const user = JSON.parse(localStorage.getItem("user"));
    if (!user) {
        alert("Увійдіть у свій акаунт!");
        return;
    }

    try {
        let response = await fetch("http://localhost:3000/api/animals/cats");
        let cats = await response.json();

        container.innerHTML = "";

        cats.forEach(cat => {
            const card = document.createElement("div");
            card.className = "animal";

            card.innerHTML = `
                <div>
                    <img src="${cat.ImageURL}" alt="${cat.Name}">
                    <p>${cat.Name.toUpperCase()}</p>
                </div>

                <div class="age">
                    <p>Вік: ${cat.Age}</p>
                    <p>Порода: ${cat.Breed}</p>
                    <p>Стать: ${cat.Gender}</p>
                </div>

                <div class="health">
                    <p>${cat.Description}</p>
                    <p>Здоров'я: ${cat.HealthStatus}</p>
                </div>

                <p class="like" data-id="${cat.AnimalID}">Вподобати</p>
                <a href="adoptform.html?animalId=${animal.AnimalID}" class="adoptbutton">Всиновити</a>
            `;

            container.appendChild(card);
        });

        enableLikes();

    } catch (error) {
        console.error(error);
        container.innerHTML = "<p style='color:red;'>Помилка завантаження котів.</p>";
    }
}

function enableLikes() {
    const user = JSON.parse(localStorage.getItem("user"));
    const userId = user.UserID;

    document.querySelectorAll(".like").forEach(btn => {
        btn.addEventListener("click", async () => {
            const animalId = btn.getAttribute("data-id");

            const response = await fetch("http://localhost:3000/api/like", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ userId, animalId })
            });

            const result = await response.json();

            if (response.ok) {
                btn.textContent = "Вподобано ❤️";
                btn.style.color = "red";
                btn.style.pointerEvents = "none";
            } else {
                alert(result.message);
            }
        });
    });
}
</script>

</body>
</html>
